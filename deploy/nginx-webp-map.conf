# =============================================================================
#  Bien $webp_suffix - dung o tang http
#
#  DAT O DAU:
#      /www/server/panel/vhost/nginx/0.webp-map.conf
#
#  nginx.conf dong 99 co `include /www/server/panel/vhost/nginx/*.conf;` nam
#  TRONG khoi http, nen file nay duoc nap o dung tang. Ten bat dau bang '0.'
#  theo quy uoc san cua aaPanel cho cac file cau hinh chung (0.fastcgi_cache.conf,
#  0.default.conf...).
#
#  VI SAO PHAI DUNG map THAY VI if
#  -------------------------------
#  Cach viet truc quan hon la dat ngay trong location:
#
#      set $webp_suffix "";
#      if ($http_accept ~* "image/webp") { set $webp_suffix ".webp"; }
#      try_files $uri$webp_suffix $uri /index.php?$query_string;
#
#  Da thu tren production: KHONG CHAY. Moi trinh duyet deu nhan ban JPEG du
#  file .webp co san ben canh va truy cap thang vao duoc. Nguyen nhan la `if`
#  trong location sinh ra mot location noi bo rieng, con `try_files` cua
#  location ngoai duoc xu ly truoc khi bien do co gia tri - mot bay quen thuoc
#  cua nginx ("if is evil").
#
#  `map` duoc tinh o tang http truoc khi chon location nen khong dinh van de do.
#
#  Sau khi them:  nginx -t  &&  nginx -s reload
# =============================================================================

map $http_accept $webp_suffix {
    default   "";
    "~*webp"  ".webp";
}
