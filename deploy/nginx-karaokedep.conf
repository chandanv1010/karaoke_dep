# =============================================================================
#  Cau hinh nginx bo sung cho karaokedep.com.vn
#
#  DAT O DAU:
#      /www/server/panel/vhost/nginx/extension/karaokedep.com.vn/seo-perf.conf
#
#  Vhost chinh da co dong `include .../extension/karaokedep.com.vn/*.conf;`
#  nen file nay duoc nap tu dong. Dat o day thay vi sua thang vhost la de
#  aaPanel sinh lai cau hinh (khi doi SSL, doi PHP...) khong xoa mat.
#
#  Sau khi them:  nginx -t  &&  nginx -s reload
# =============================================================================


# -----------------------------------------------------------------------------
#  1. Gop www ve khong-www
# -----------------------------------------------------------------------------
#  Vhost khai `server_name karaokedep.com.vn www.karaokedep.com.vn;` nen ca hai
#  ten mien deu tra ve 200 voi cung noi dung. The canonical dang tro dung ve
#  ban khong-www nen Google chua phat, nhung de hai duong cung phuc vu noi dung
#  that la tu chia doi tin hieu. 301 la cach dut diem.
if ($host = www.karaokedep.com.vn) {
    return 301 https://karaokedep.com.vn$request_uri;
}


# -----------------------------------------------------------------------------
#  2. Anh da resize - phuc vu tinh, khong qua PHP
# -----------------------------------------------------------------------------
#  Day la thay doi quan trong nhat ve hieu nang.
#
#  Do duoc trên production truoc khi sua:
#      mot anh DA NAM TRONG CACHE van mat 0,56s  (vi di qua Laravel)
#      mot file tinh do nginx phuc vu mat        0,011s
#  Trang chu co 114 request anh => khoang 65 giay thoi gian worker cho MOT
#  luot xem trang. Pool chi co 30 worker, nen log ghi 307 lan
#  "server reached max_children (30)" va TTFB nhay tu 0,85s len 9,5s.
#
#  Duong dan moi mang san kich thuoc: /image-cache/600x0/uploads/images/a.jpg
#  Hai file nam canh nhau tren dia:
#      .../a.jpg        ban dinh dang goc
#      .../a.jpg.webp   ban WebP
#  nginx chon giup theo header Accept. Chua co file thi roi xuong index.php,
#  Laravel resize va ghi ra dung duong dan do - lan sau nginx lo.
location ^~ /image-cache/ {
    # Suffix rong thi $uri$webp_suffix == $uri, try_files thu trung mot lan,
    # vo hai. Cach nay tranh phai khai `map` o tang http (aaPanel chi include
    # file nay trong khoi server).
    set $webp_suffix "";
    if ($http_accept ~* "image/webp") {
        set $webp_suffix ".webp";
    }

    # Bat buoc: cung mot URL co the tra ve hai dinh dang. Thieu Vary thi CDN
    # cache mot ban roi phat cho ca trinh duyet khong doc duoc WebP.
    add_header Vary Accept;

    # Duong dan da chua kich thuoc nen doi anh la doi duong dan - cache dai
    # ngay duoc ma khong so phat ban cu.
    expires 1y;
    add_header Cache-Control "public, immutable";

    access_log off;

    try_files $uri$webp_suffix $uri /index.php?$query_string;
}


# -----------------------------------------------------------------------------
#  3. Nen gzip cho HTML va tai nguyen van ban
# -----------------------------------------------------------------------------
#  HTML trang chu la 125KB tho. Gzip dua ve khoang 18KB.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_types
    text/plain text/css text/xml
    application/javascript application/json application/xml
    application/rss+xml image/svg+xml;
